name: CI

on:
  push:
    branches: dev
  pull_request:
    branches: dev

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev libgtest-dev libeigen3-dev

      - name: Create Eigen symlink for compatibility
        run: |
          mkdir -p deps
          ln -s /usr/include/eigen3 deps/eigen-3.4.0

      - name: Build project
        run: |
          make all EIGEN_PATH=${{ github.workspace }}/deps/eigen-3.4.0

      - name: Run tests
        run: |
          make test
          ./test-gaussian_solver

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gaussian-solver-bin
          path: |
            gaussian_solver
            test-gaussian_solver
